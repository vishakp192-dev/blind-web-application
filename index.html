<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NavAid Mobile - Ultra Fast Object Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7b4bff;
            --background: #f2eaff;
            --text: #333;
            --success: #4CAF50;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: var(--background);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #app {
            flex-grow: 1;
            position: relative;
        }

        .camera-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #000;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror for selfie view */
        }

        .controls {
            position: absolute;
            bottom: 10%;
            left: 0;
            right: 0;
            padding: 0 15px;
            display: flex;
            justify-content: center;
            gap: 24px;
            z-index: 3;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .voice-feedback {
            position: absolute;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-weight: 600;
            text-align: center;
            z-index: 3;
            min-height: 44px;
        }

        @media (max-width: 480px) {
            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .voice-feedback {
                bottom: 70px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
        </div>
        <div class="voice-feedback" id="voiceFeedback">
            Voice guidance initializing...
        </div>
        <div class="controls">
            <button class="control-btn" id="toggleDetection">▶</button>
            <button class="control-btn" id="toggleCamera">⏸</button>
            <button class="control-btn" id="toggleFlash">⚡</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <script>
        let model = null;
        let isDetecting = false;
        let isCameraPaused = false;

        const video = document.getElementById('video');
        const voiceFeedback = document.getElementById('voiceFeedback');
        const toggleDetection = document.getElementById('toggleDetection');
        const toggleCamera = document.getElementById('toggleCamera');
        const toggleFlash = document.getElementById('toggleFlash');

        // Initialize the application
        async function init() {
            try {
                await tf.ready();
                model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });

                await startCamera();
                voiceFeedback.textContent = 'NavAid is ready. Tap to start detection.';
            } catch (error) {
                voiceFeedback.textContent = 'Failed to initialize. Please refresh.';
                console.error('Error initializing:', error);
            }
        }

        // Start camera with optimized settings
        async function startCamera() {
            const constraints = {
                video: {
                    facingMode: 'environment',
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    frameRate: { ideal: 30 }
                },
                audio: false
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.play();
            } catch (error) {
                console.error('Camera error:', error);
                voiceFeedback.textContent = 'Camera access is required.';
            }
        }

        // Detection logic
        async function detectObjects() {
            if (isDetecting) {
                const detections = await model.detect(video);
                processDetections(detections);
            }
        }

        function processDetections(detections) {
            detections.forEach(detection => {
                if (detection.score >= 0.5) {
                    const [x, y, width, height] = detection.bbox;
                    // Draw bounding box
                    const ctx = video.getContext('2d');
                    ctx.strokeStyle = '#7b4bff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, width, height);
                    // Draw label
                    ctx.fillStyle = '#7b4bff';
                    ctx.fillText(detection.class, x, y > 10 ? y - 5 : 10);
                }
            });
        }

        // Toggle detection on/off
        toggleDetection.addEventListener('click', () => {
            isDetecting = !isDetecting;
            toggleDetection.textContent = isDetecting ? '■' : '▶';
            if (isDetecting) {
                detectObjects();
            }
        });

        // Pause/resume camera
        toggleCamera.addEventListener('click', () => {
            isCameraPaused = !isCameraPaused;
            if (isCameraPaused) {
                video.pause();
            } else {
                video.play();
            }
        });

        // Flash toggle
        toggleFlash.addEventListener('click', () => {
            alert("Flash toggle is not supported in this environment.");
        });

        // Initialize the app
        init();
    </script>
</body>
</html>
