<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavAid Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #000; 
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        #app { width: 100%; height: 100%; position: relative; }
        
        .camera-container {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 10px;
            z-index: 10;
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 10;
        }
        
        button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: white;
            font-size: 20px;
            cursor: pointer;
        }
        
        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading" id="loading">
            <h2>NavAid Mobile</h2>
            <p id="statusText">Starting up...</p>
        </div>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
        </div>
        
        <div class="status" id="status">Loading...</div>
        
        <div class="controls">
            <button id="startBtn">▶</button>
            <button id="cameraBtn">⏸</button>
        </div>
    </div>

<script>
// Simple mobile-friendly implementation
class SimpleNavAid {
    constructor() {
        this.video = document.getElementById('video');
        this.overlay = document.getElementById('overlay');
        this.ctx = this.overlay.getContext('2d');
        this.status = document.getElementById('status');
        this.loading = document.getElementById('loading');
        this.statusText = document.getElementById('statusText');
        
        this.isRunning = false;
        this.isCameraPaused = false;
        this.model = null;
        
        this.init();
    }

    async init() {
        try {
            this.updateStatus('Requesting camera...');
            
            // Start camera first
            await this.startCamera();
            
            this.updateStatus('Loading AI model...');
            
            // Load AI model
            await this.loadModel();
            
            this.updateStatus('Ready!');
            this.loading.classList.add('hidden');
            
            // Setup controls
            this.setupControls();
            
        } catch (error) {
            this.updateStatus('Error: ' + error.message);
            console.error('Init error:', error);
        }
    }

    updateStatus(text) {
        this.status.textContent = text;
        if (this.statusText) {
            this.statusText.textContent = text;
        }
    }

    async startCamera() {
        try {
            // Simple camera constraints
            const constraints = {
                video: {
                    facingMode: 'environment',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };
            
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            this.video.srcObject = stream;
            
            return new Promise((resolve) => {
                this.video.onloadeddata = () => {
                    this.overlay.width = this.video.videoWidth;
                    this.overlay.height = this.video.videoHeight;
                    resolve();
                };
            });
            
        } catch (error) {
            throw new Error('Camera access denied. Please allow camera permissions.');
        }
    }

    async loadModel() {
        // Load TensorFlow.js dynamically
        await this.loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js');
        await this.loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js');
        
        this.model = await cocoSsd.load();
    }

    loadScript(src) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = resolve;
            script.onerror = () => reject(new Error(`Failed to load ${src}`));
            document.head.appendChild(script);
        });
    }

    setupControls() {
        const startBtn = document.getElementById('startBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        
        startBtn.addEventListener('click', () => {
            this.isRunning = !this.isRunning;
            startBtn.textContent = this.isRunning ? '■' : '▶';
            this.updateStatus(this.isRunning ? 'Detecting...' : 'Ready');
            
            if (this.isRunning) {
                this.detectObjects();
            }
        });
        
        cameraBtn.addEventListener('click', () => {
            this.isCameraPaused = !this.isCameraPaused;
            cameraBtn.textContent = this.isCameraPaused ? '▶' : '⏸';
            
            if (this.isCameraPaused) {
                this.video.pause();
            } else {
                this.video.play();
            }
        });
    }

    async detectObjects() {
        if (!this.isRunning) return;
        
        try {
            const detections = await this.model.detect(this.video);
            this.drawDetections(detections);
            this.announceDetections(detections);
        } catch (error) {
            console.error('Detection error:', error);
        }
        
        // Continue detection loop
        if (this.isRunning) {
            setTimeout(() => this.detectObjects(), 500);
        }
    }

    drawDetections(detections) {
        this.ctx.clearRect(0, 0, this.overlay.width, this.overlay.height);
        
        detections.forEach(det => {
            if (det.score > 0.5) {
                const [x, y, width, height] = det.bbox;
                
                // Draw bounding box
                this.ctx.strokeStyle = '#7b4bff';
                this.ctx.lineWidth = 2;
                this.ctx.strokeRect(x, y, width, height);
                
                // Draw label
                this.ctx.fillStyle = '#7b4bff';
                this.ctx.fillRect(x, y - 20, 100, 20);
                this.ctx.fillStyle = 'white';
                this.ctx.font = '14px Arial';
                this.ctx.fillText(det.class + ' ' + (det.score * 100).toFixed(0) + '%', x + 5, y - 5);
            }
        });
    }

    announceDetections(detections) {
        const importantObjects = detections.filter(det => 
            det.score > 0.6 && 
            ['person', 'car', 'chair', 'bottle', 'cup'].includes(det.class)
        );
        
        if (importantObjects.length > 0 && 'speechSynthesis' in window) {
            const object = importantObjects[0];
            const utterance = new SpeechSynthesisUtterance(object.class + ' detected');
            utterance.rate = 1.0;
            speechSynthesis.speak(utterance);
        }
    }
}

// Start the app when page loads
window.addEventListener('load', () => {
    new SimpleNavAid();
});

// Handle errors
window.addEventListener('error', (event) => {
    console.error('Global error:', event.error);
});
</script>
</body>
</html>
